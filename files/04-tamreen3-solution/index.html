<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>سارة أحمد</h1>
    <nav>
      <a href="#about">من أنا</a>
      <a href="#skills">مهاراتي</a>
      <a href="#contact">تواصل معي</a>
    </nav>
  </header>
  <main>
    <section id="about">
      <h2>من أنا</h2>
      <img src="images/me.jpg" alt="صورة سارة">
      <p>أتعلّم تطوير الويب في المفرق.</p>
    </section>
    <section id="skills">
      <h2>مهاراتي</h2>
      <ul class="skills">
        <li class="card">HTML</li>
        <li class="card">CSS</li>
        <li class="card">JavaScript</li>
      </ul>
    </section>
    <section id="contact">
      <h2>تواصل معي</h2>
      <form>
        <label for="name">الاسم</label>
        <input type="text" id="name" required>
        <label for="email">البريد</label>
        <input type="email" id="email">
        <label for="msg">رسالتك</label>
        <textarea id="msg"></textarea>
        <button type="submit">إرسال</button>
      </form>
    </section>
  </main>
  <footer>&copy; 2026 سارة أحمد</footer>

  <script src="script.js"></script>
</body>
</html>
